# 可选容器化方案：本机未安装 PostgreSQL 时用这里的 PostgreSQL 16 + pgvector。
# 后端默认直连本机 PostgreSQL（5432）；使用本方案时在 .env 中改 DB_PORT=5433、DB_USER=rag、DB_PASSWORD=rag123456
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ragknowledge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ragknowledge
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag123456
    ports:
      # 宿主机用 5433，避开本机已安装 PostgreSQL 服务占用的 5432
      - "5433:5432"
    volumes:
      - ragknowledge-pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d ragknowledge"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  ragknowledge-pgdata:
