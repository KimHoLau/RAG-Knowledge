server:
  port: 8080
  # 优雅停机：等在途请求（尤其 SSE 流式回答）收尾再退进程，避免重启时回答被腰斩
  shutdown: graceful

spring:
  application:
    name: rag-knowledge-backend
  # 虚拟线程（Java 21）：检索重排序、入库向量化、LLM 流式都是秒级阻塞调用，
  # 平台线程池下并发请求容易堆满；PG 驱动 42.7+ 已无 synchronized pinning 问题
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 120MB
  datasource:
    # 宿主机端口 5433：避开本机已安装 PostgreSQL 服务占用的 5432（见 docker/docker-compose.yml）
    url: jdbc:postgresql://${PG_HOST:localhost}:${PG_PORT:5433}/${PG_DATABASE:ragknowledge}
    username: ${PG_USERNAME:rag}
    password: ${PG_PASSWORD:rag123456}
    hikari:
      pool-name: rag-hikari
      # 默认只有 10 连接：入库线程池、检索、列表轮询会一起抢，按需放开
      maximum-pool-size: ${PG_POOL_MAX:20}
      minimum-idle: ${PG_POOL_MIN_IDLE:5}
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      # 小于数据库的连接空闲回收时间，避免拿到已被服务端关闭的连接
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  ai:
    vectorstore:
      pgvector:
        initialize-schema: true
        # 向量列维度 1024：与 OpenAI 兼容请求的 dimensions=1024 一致（qwen3-embedding:4b 原生 2560 维，由该参数截断）
        dimensions: 1024
        distance-type: COSINE_DISTANCE
        index-type: HNSW
        schema-name: public
        table-name: vector_store

rag:
  # 对话大模型：智谱 GLM-5.3（OpenAI 兼容协议），SDK 自动在 baseUrl 后拼接 /chat/completions
  llm:
    base-url: ${LLM_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
    api-key: ${ZHIPUAI_API_KEY:no-key}
    model: ${LLM_MODEL:glm-5.3}
    # RAG 问答要求答案紧贴参考资料，温度偏高容易自由发挥产生幻觉
    temperature: ${LLM_TEMPERATURE:0.3}
    # 单次请求超时（秒）：流式长回答也要在这个时间内产出首包并持续推进
    timeout-seconds: ${LLM_TIMEOUT_SECONDS:180}
    max-retries: ${LLM_MAX_RETRIES:2}
  # 向量模型（任意 OpenAI 兼容服务），SDK 自动在 baseUrl 后拼接 /embeddings
  # base-url 必须以 /v1 结尾：Ollama 的 /v1 才是 OpenAI 兼容端点（返回 {"data":[...]}），
  # 写成 /api 会打到原生 legacy 端点（返回 {"embedding":[...]}），SDK 解析报 'data' is not set。
  # Docker 部署 Ollama 只需把 11434 映射到宿主机，路径仍用 /v1；本地默认 http://localhost:11434/v1
  embedding:
    base-url: ${EMBEDDING_BASE_URL:http://localhost:11434/v1}
    api-key: ${EMBEDDING_API_KEY:no-key}
    model: ${EMBEDDING_MODEL:qwen3-embedding:4b-q4_K_M}
    dimensions: 1024
    # 超时按"单批切片的端到端耗时"给足：/v1/embeddings 非流式，首字节在整批算完后才返回。
    # qwen3-embedding:4b-q4_K_M（2.5GB，完整装入 4GB 显存）实测单批 8 条约 30s（首请求含
    # 模型加载 ~8s），120s 有 2 倍以上余量；换 8B 级大模型（仅部分进显存、跑 CPU）才需调到 600
    timeout-seconds: ${EMBEDDING_TIMEOUT_SECONDS:120}
    max-retries: ${EMBEDDING_MAX_RETRIES:2}
  # 重排序模型（Qwen3-Reranker）：检索先向量粗召回、再精排，提升引用资料与问题的相关性。
  # rerank 无 OpenAI 协议，且 Ollama 没有原生 rerank 端点，需用 llama.cpp / vLLM / SiliconFlow 等承载
  #（Jina/Cohere 风格 /rerank 协议），客户端在 base-url 后拼接 /rerank；
  # 服务不可用时自动退回向量排序，只损失排序质量，不影响问答可用性
  rerank:
    enabled: ${RERANK_ENABLED:true}
    base-url: ${RERANK_BASE_URL:http://localhost:8900/v1}
    api-key: ${RERANK_API_KEY:no-key}
    model: ${RERANK_MODEL:Qwen3-Reranker-4B:Q4_K_M}
    # 非流式整批打分接口。GTX 1650 Ti 实测吞吐 ~150 token/s：10 条 400-token 候选 ≈ 30s，
    # 90s 给足 2 倍余量；强 GPU/云端精排秒级完成，超时只是上限不拖慢正常请求
    timeout-seconds: ${RERANK_TIMEOUT_SECONDS:90}
  # 检索参数
  search:
    top-k: ${RAG_TOP_K:5}
    # 送入重排序的向量召回候选数（≥top-k 才有精排意义，服务端截到 50 上限）。
    # 默认 10 按弱 GPU 打分耗时校定（候选数 × 切片 token 数 ÷ ~150 tok/s），
    # 强 GPU / SiliconFlow 云端可调回 20 换更高精排上限
    candidate-top-k: ${RAG_CANDIDATE_TOP_K:10}
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.45}
  # 文档切分参数（token 数）
  # chunk-size 400 而非 800：重排序打分耗时与切片长度成正比，800-token 切片在 4GB 显存级 GPU 上
  # 精排 10 条要 ~65s（1650 Ti 实测 ~150 tok/s），400 让整链路落在 30s 内且引用粒度更细；
  # 注意切分参数只影响新入库文档，改动后旧文档需重新上传才会按新粒度重建切片
  split:
    chunk-size: 400
    min-chunk-size: 300
  # 入库时向量化的批大小（每批一个 HTTP 请求，超时按单批端到端耗时算）。
  # 8 条一批：qwen3-embedding:4b-q4_K_M（完整装入 4GB 显存）实测单批 ~30s，吞吐最优；
  # 换 8B 级大模型（仅部分进显存、跑 CPU，单批可达 10 分钟级）时须降回 2 并放大超时，否则必超时
  ingest:
    batch-size: 8
    # 入库专用线程池（见 config/AsyncConfig），限制并发避免把向量服务与连接池打满
    core-pool-size: ${INGEST_CORE_POOL_SIZE:2}
    max-pool-size: ${INGEST_MAX_POOL_SIZE:4}
    queue-capacity: ${INGEST_QUEUE_CAPACITY:100}
  # 原始文件保存目录
  storage-dir: ${STORAGE_DIR:./data/uploads}
  # CORS 允许的前端来源（逗号分隔），前端换端口或部署时通过 CORS_ALLOWED_ORIGINS 覆盖
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

logging:
  level:
    # 本地排障默认 DEBUG；部署到生产时用 LOG_LEVEL=INFO 收敛日志量
    com.ragknowledge: ${LOG_LEVEL:DEBUG}
